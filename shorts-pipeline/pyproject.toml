[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "Automated faceless short-form video pipeline: script -> voice -> visuals -> captions -> render -> publish"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.80",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
shorts = "shorts_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S603", "S607"]  # subprocess calls are to ffmpeg with argv lists, never a shell

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108"]  # asserts and dummy tokens are the point of tests
"src/shorts_pipeline/render/captions.py" = ["E501"]  # ASS format header lines

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["shorts_pipeline"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
