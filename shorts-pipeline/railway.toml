# Railway: one always-on service runs the health/media server and the every-3-days scheduler.
# Attach a volume mounted at /app/data so job history (and therefore the cadence) survives redeploys.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "shorts --config /app/config.yaml --data-dir /app/data serve"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
