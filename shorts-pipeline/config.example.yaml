# Copy to config.yaml. Secrets never go here; they come from the environment (.env.example).
data_dir: data

script:
  provider: claude            # claude | mock
  model: claude-opus-5-5
  niche: brutally honest descriptions of everyday things (products, jobs, menus, holidays, apps)
  audience: adults 20-40 who enjoy dry humour and have been lied to by marketing
  language: English
  target_seconds: 35
  brief: |
    Channel: "Honestly." A calm, slightly tired narrator who cannot lie describes one
    everyday thing the way its marketing never would. Comedy comes from understatement
    and specificity, never from shouting or sarcasm in tone.
    Hook: "<Thing>. The honest version." then straight into the first beat.
    Four beats, each one a feature described truthfully; the last beat stings a little.
    End with: "What should we be honest about next?"
    Visual prompts: glossy, over-polished advertising photography of the thing, perfect
    lighting, no people's faces, no text. The picture promises perfection; the voice tells
    the truth.
    Never name a real brand, company or person. Generic categories only.
  topics: []                  # optional queue; empty = model picks within the niche
  avoid_recent: 30

voice:
  provider: elevenlabs        # elevenlabs | mock
  voice_id: 21m00Tcm4TlvDq8ikWAM
  model_id: eleven_multilingual_v2
  speed: 1.0

visuals:
  provider: fal               # fal (AI images) | pexels (stock video) | mock
  fal_model: fal-ai/flux/schnell
  style_suffix: glossy advertising photography, studio lighting, vertical 9:16 composition, no text, no faces
  motion: kenburns

render:
  fps: 30
  font: DejaVu Sans
  font_size: 72
  highlight_color: "&H0000D7FF"   # ASS &HAABBGGRR
  music_path: null                # e.g. assets/music.mp3 (royalty-free), looped under the voice
  music_gain_db: -18
  crf: 20

publish:
  providers: [youtube, instagram, tiktok]   # any subset, or [mock] for dry runs
  youtube_privacy: public
  tiktok_privacy: SELF_ONLY       # TikTok forces private until the app passes audit
  require_all: false              # true = any failed platform fails the job

schedule:
  every_days: 3
  hour_utc: 14
  check_interval_seconds: 900
