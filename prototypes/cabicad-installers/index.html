<title>CABICAD מתקינים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone (the installer app) beside a desk panel (manager board + CABICAD sync log), on a faint drafting grid. */
:root{
  --bg:#edf0f4; --grid:rgba(36,71,214,.06); --surface:#ffffff; --surface-2:#f5f7fa;
  --ink:#141b26; --muted:#5b6676; --line:#d8dee6;
  --accent:#2447d6; --accent-ink:#ffffff; --accent-soft:#e7ecfd;
  --ok:#1d8656; --ok-soft:#e3f4ea; --warn:#a96c12; --warn-soft:#fbf0dc; --bad:#c2362f; --bad-soft:#fbe5e3;
  --f-display:"Rubik","Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1219; --grid:rgba(125,151,255,.05); --surface:#151c27; --surface-2:#1b2431;
  --ink:#e7ecf3; --muted:#97a3b5; --line:#2a3443;
  --accent:#7d97ff; --accent-ink:#0d1219; --accent-soft:#1e2748;
  --ok:#4cc38a; --ok-soft:#143326; --warn:#e2aa4c; --warn-soft:#352914; --bad:#f07067; --bad-soft:#3a1c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1219; --grid:rgba(125,151,255,.05); --surface:#151c27; --surface-2:#1b2431;
  --ink:#e7ecf3; --muted:#97a3b5; --line:#2a3443;
  --accent:#7d97ff; --accent-ink:#0d1219; --accent-soft:#1e2748;
  --ok:#4cc38a; --ok-soft:#143326; --warn:#e2aa4c; --warn-soft:#352914; --bad:#f07067; --bad-soft:#3a1c1b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{max-width:1180px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.top h1{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance}
.top h1 b{color:var(--accent)}
.top p{margin:0;color:var(--muted);font-size:14px}
.stage{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:0}
.muted{color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500}

/* phone */
.phone{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(20,27,38,.35);height:780px;display:flex;flex-direction:column}
@media (max-width:900px){.phone{height:auto;min-height:640px;border-radius:20px}}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar h2{font-family:var(--f-display);font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:18px;line-height:1}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.busy .dot{animation:none}}
.screen{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){.screen{overflow:visible}}
.screen>*{flex-shrink:0}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
button.card:hover{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.scheduled{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.in_progress{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.blocked{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.prog{height:6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px}
.prog.done i{background:var(--ok)}
.title{font-family:var(--f-display);font-weight:700;font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 8px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.count{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-inline-start:4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:start;width:100%}
.check .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through}
.check[disabled]{opacity:.55;cursor:not-allowed}
.dims{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;inset:auto 0 0 0;font-size:11px;padding:2px 6px;background:rgba(0,0,0,.55);color:#fff}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--ok-soft)}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 2px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.sev-3[aria-pressed="true"],.seg button.sev-4[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}
.stars button{border:0;background:none;font-size:28px;line-height:1;color:var(--line);padding:0}
.stars button.on{color:var(--warn)}
canvas.sig{width:100%;height:160px;border:1px dashed var(--muted);border-radius:10px;background:var(--surface-2);touch-action:none;display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;z-index:5}
@media (max-width:900px){.sheet-bg{position:fixed}}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);margin:0;font-size:18px}
.rj{border-inline-start:4px solid var(--line)}
.rj.P1{border-inline-start-color:var(--bad)}.rj.P2{border-inline-start-color:var(--warn)}.rj.P3{border-inline-start-color:var(--accent)}
.pill.P1{background:var(--bad);color:#fff;border-color:transparent}.pill.P2{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.P3{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.r-open{background:var(--bad-soft);color:var(--bad);border-color:transparent}.pill.r-in_progress{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pill.r-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.code{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.sla{font-size:12px;font-variant-numeric:tabular-nums}.sla.over{color:var(--bad);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg.c2{grid-template-columns:repeat(2,1fr)}.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button[data-g="priority"][data-k="P1"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.auto{font-size:11px;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:0 6px;margin-inline-start:6px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;border-inline-start:2px solid var(--line);padding-inline-start:12px}
.hist li{font-size:13px}.hist time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:13px}
.alertbar{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-weight:500;font-size:14px}
.rlist{display:flex;flex-direction:column;gap:8px}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--surface)}
.stepper button{border:0;background:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}
.stepper b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.stepper button[aria-current="step"]{color:var(--accent);border-color:var(--accent);font-weight:500}
.stepper button[aria-current="step"] b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.past b{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch{margin:0;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tags li{display:grid;grid-template-columns:28px auto minmax(0,1fr);gap:8px;align-items:center;font-size:13px;padding:8px;border-radius:8px;background:var(--surface-2)}
.tags .ic{font-size:18px;text-align:center}.tags .k{color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.next{margin-top:4px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:start;display:flex;flex-direction:column;gap:4px}
.choice button b{font-family:var(--f-display);font-size:15px}.choice button span{font-size:12px;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);background:var(--surface-2);overflow:hidden;position:relative;cursor:pointer;max-width:100%}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.has{border-style:solid;border-color:var(--ok)}
.slot .cap{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px}
.fsec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.fsec>h4{margin:0;font-family:var(--f-display);font-size:15px}
.stepq{display:flex;align-items:center;gap:8px}.stepq button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px}
.stepq input{width:56px;text-align:center}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nums input{direction:ltr;text-align:center}
.plist{max-height:208px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column}
.plist button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;text-align:start;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:none}
.plist button:last-child{border-bottom:0}
.plist button .nm{font-weight:500;font-size:14px}
.plist button .muted{grid-column:2/-1;font-size:11px}
.plist button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.plist button:hover{background:var(--accent-soft)}
canvas.sk{height:200px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.thumbs button{padding:0;border:0;background:none;border-radius:6px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,11,16,.85);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:90vh;border-radius:10px}
details.acc{border-top:1px solid var(--line);padding-top:8px}
details.acc summary{cursor:pointer;font-weight:500;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"▾";color:var(--muted)}
details.acc[open] summary::after{content:"▴"}
.accgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;margin-top:8px}
.accgrid dt{color:var(--muted)}.accgrid dd{margin:0}
.yes{color:var(--warn);font-weight:700}.no{color:var(--ok);font-weight:500}

/* desk panel */
.desk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.desk .tabs{margin:0;padding:0 16px}
.desk-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .prog{width:90px;display:inline-block;vertical-align:middle}
.log{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log li{list-style:none;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.log li:last-child{border-bottom:0}
.log ul{margin:0;padding:0}
.m{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);direction:ltr}
.m.POST{background:var(--ok-soft);color:var(--ok)}.m.PATCH{background:var(--warn-soft);color:var(--warn)}.m.EVT{background:var(--bad-soft);color:var(--bad)}
.path{font-family:var(--f-mono);font-size:12px;direction:ltr;text-align:left;overflow-wrap:anywhere}
.log .n{grid-column:1/-1;font-size:13px;color:var(--muted)}
.log time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.foot{max-width:1180px;margin:20px auto 0;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;color:var(--muted);font-size:13px}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:4px 0 0;font-family:var(--f-display);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sec h4 span{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.doc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0;overflow:hidden;text-align:start;display:flex;flex-direction:column}
.doc:hover{border-color:var(--accent)}
.doc .th{aspect-ratio:4/3;background:var(--surface-2);border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden;max-width:100%}
.doc .th svg{width:100%;height:100%}
.doc .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.doc .meta b{font-size:13px;font-weight:500}
.new{font-size:10px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;margin-inline-start:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.kv dt,.kv dd{margin:0;padding:8px 10px;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted);background:var(--surface-2);white-space:nowrap}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.viewer{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);max-height:52vh;direction:ltr}
.viewer svg{display:block;width:100%;height:auto}
.viewer.zoom svg{width:240%}

const pad2=n=>String(n).padStart(2,'0');
function partsOf(c){
  const T=18,P=[],body='סנדוויץ׳ 18 לבן',hdf='HDF 8 לבן',t=c.code[0],w=c.w,h=c.h,d=c.d;
  const add=(name,L,W,th,mat,edge,qty=1,kind='body',side='')=>P.push({code:`${c.code}.${pad2(P.length+1)}`,name,L:Math.round(L),W:Math.round(W),th,mat,edge,qty,kind,side});
  if(/מדיח/.test(c.name)){add('חזית מדיח',w-4,h-4,19,c.front,'4 צדדים',1,'front');add('ערכת חיבור חזית למדיח',0,0,0,'פרזול','',1,'hw');return P}
  add('דופן ימין',h,d,T,body,'קדמי');add('דופן שמאל',h,d,T,body,'קדמי');add('תחתית',w-2*T,d,T,body,'קדמי');
  if('BI'.includes(t)){add('חיזוק עליון קדמי',w-2*T,100,T,body,'');add('חיזוק עליון אחורי',w-2*T,100,T,body,'')} else add('תקרה',w-2*T,d,T,body,'קדמי');
  add('גב',w-2,h-2,8,hdf,'');
  const dm=c.name.match(/(\d)\s*מגירות/),drawers=dm?+dm[1]:0,shelves=drawers?0:({B:1,W:1,T:4,P:4,V:0,I:2}[t]??1);
  if(shelves)add('מדף',w-2*T-2,d-20,T,body,'קדמי',shelves);
  if(drawers){for(let k=0;k<drawers;k++)add(`חזית מגירה ${k+1}`,w-4,Math.round(h/drawers)-4,19,c.front,'4 צדדים',1,'front');add('מסילות מגירה (זוג)',0,0,0,'Blum Legrabox','',drawers,'hw')}
  else{const nd=w>=800?2:1;for(let k=0;k<nd;k++)add(nd===2?(k?'דלת שמאל':'דלת ימין'):'דלת',w/nd-4,h-4,19,c.front,'4 צדדים',1,'front',nd===2?(k?'שמאל':'ימין'):'ימין');

  return P;
}

let skDirty=false;
function initSketch(){
  const c=document.getElementById('sk'); if(!c||c._init)return; c._init=1;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round';
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2447d6';
  let down=false; skDirty=false; const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))});
  c.addEventListener('pointermove',e=>{if(!down)return;x.lineTo(...p(e));x.stroke();skDirty=true});
  c.addEventListener('pointerup',()=>down=false);
}
function sketchPNG(){const c=document.getElementById('sk'),o=document.createElement('canvas');o.width=c.width;o.height=c.height;

function render(){
  const st=phone.querySelector('.screen')?.scrollTop||0;

  const sc=phone.querySelector('.screen'); if(sc)sc.scrollTop=st;

  if(S.sheet==='sign')initSig();

function initSig(){
  const c=document.getElementById('sig'); if(!c||c._init)return; c._init=1;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round';
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#141b26';
  let down=false; sigDirty=false;
  const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))});
  c.addEventListener('pointermove',e=>{if(!down)return;x.lineTo(...p(e));x.stroke();sigDirty=true});
  c.addEventListener('pointerup',()=>down=false);
}

function readImage(file,max=520){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.72))};
      im.onerror=rej; im.src=fr.result};
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

    i.status='done'; S.sheet=null;
    S.log.unshift({at:i.signoff.at,m:'POST',p:`/v1/installs/${i.id}/signoff`,n:`מסירה: ${draft.signer} · דירוג ${draft.rating}/5 · אישר ${conf.filter(Boolean).length}/${CONFIRMS.length} סעיפים${open?` · ${open} השלמות פתוחות`:''}`});
    api('PATCH',`/v1/projects/${i.id}`,`הפרויקט סומן ב-CABICAD כ״${open?'נמסר עם השלמות':'הותקן'}״ · ${i.steps.filter(Boolean).length}/${i.steps.length} שלבים · ${SLOTS.filter(([k])=>i.slots[k]).length} צילומי מסירה`);
  }
});

render();
})();
</script>
