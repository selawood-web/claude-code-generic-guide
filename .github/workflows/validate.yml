name: validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate links, skills, configs, and hooks
        run: python tools/validate.py
      # The catalog tables and counts are generated; a stale one is a rules file
      # that lies about what is installed. update.sh no longer rewrites them on
      # session start, so this is where drift is caught.
      - name: Catalog tables and counts are current
        run: |
          if [ -f tools/catalog.py ]; then python tools/catalog.py; else echo "No catalog generator in this repo — skipping."; fi
      # Installed projects get `tools/validate.py` and this workflow, but not the
      # validator's own tests — `unittest discover` then exits 5 ("NO TESTS RAN")
      # and every wired project's first PR goes red. Skip when there is nothing
      # to run; never weaken the run itself.
      # The gate's guarantees as tests of the gate: each probe plants a defect in a
      # scratch copy and records whether the validator fires. A probe the list
      # marks `caught` that is missed is a regression and fails the job.
      # Headless runs never read .claude/agents/; they get the same briefs as inline
      # JSON from this script. A frontmatter key it cannot carry fails here, so a
      # headless run can never quietly differ from an interactive one.
      - name: Audit agents serialize for headless runs
        run: |
          if [ -f tools/audit_agents_json.py ]; then python tools/audit_agents_json.py --check; else echo "No audit agent serializer in this repo — skipping."; fi
      # The hook-stdout, command-resolution and network-exec detectors live only in
      # audit_facts.py, and nothing ran them on a trigger nobody has to remember:
      # the audit workflow is manual by design and the probe harness's gate is
      # validate.py, so they inherited a manual-only trigger (finding T-008). The
      # cheap deterministic half runs here; the model stage stays invocation-only.
      # --fail-on-findings stops on the defect-shaped kinds only — what the
      # settings grant is a fact for review, not a reason to fail a project's CI.
      - name: Deterministic fact checks
        run: |
          if [ -f tools/audit_facts.py ]; then
            python tools/audit_facts.py --fail-on-findings
          else
            echo "No deterministic fact checks in this repo — skipping."
          fi
      # tools/probes.txt is this repository's contract with its own gate: the
      # mutations name install.sh, update.sh, SYSTEM-OVERVIEW.md, decisions/ and
      # the CI file's own steps. Wiring a real project ran it there and it was
      # meaningless — six errors from files that project does not have, and six
      # "regressions" that were the gate correctly behaving differently in an
      # installed project. A project's CI should measure its own gate, not this
      # one's. So the harness runs where the list belongs; install.sh is the
      # same signal the unit-test step below already uses. --fail-on-skip is
      # safe here for the same reason: here a skip means a probe died.
      - name: Mutation probes against the validator
        run: |
          if [ -f install.sh ]; then
            python tools/audit_probes.py --fail-on-skip
          else
            echo "tools/probes.txt is the guide's contract with its own gate — not measured here."
          fi
      - name: Unit tests for the validator
        run: |
          if ls tools/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s tools -p "test_*.py" -v
          elif [ -f install.sh ]; then
            echo "install.sh is present, so this is the guide repository itself: tools/test_*.py is missing, which is a defect and not a skip" >&2
            exit 1
          else
            echo "No validator unit tests in this repo — skipping."
          fi
