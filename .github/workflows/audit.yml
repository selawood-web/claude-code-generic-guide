name: audit

# The headless half of /ccgg-audit (F002 slice 3). An audit is invoked, never
# automatic: the skill carries `disable-model-invocation: true` for the same
# reason this workflow does not run on every push. Start it by hand, or put the
# `audit` label on a pull request. A labelled pull request re-audits on each
# push to it, each run capped by its own budget.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all, harness, process, product, or a path"
        type: string
        default: all
      budget_usd:
        description: "hard spend cap for the run"
        type: string
        default: "10"
      dry_run:
        description: "assemble and render only — no model run, no spend"
        type: boolean
        default: false
      probe_tools:
        description: "one turn, ~1 cent: ask the run which tools it actually has, then stop"
        type: boolean
        default: false
      probe_verifier:
        description: "a few turns, ~$1: does the verifier's inline guard hook fire, then stop"
        type: boolean
        default: false
  pull_request:
    types: [opened, labeled, synchronize]

permissions:
  contents: read          # the audit reads the tree and never writes to it
  pull-requests: write    # one comment carrying the report

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # A labeled pull request, or a manual run. Never a fork: GitHub withholds
    # secrets from fork pull requests, so the run could only fail at auth.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'audit') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the verifier's worktree and the base-ref guard both need history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Settings
        id: settings
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          BUDGET: ${{ inputs.budget_usd || '10' }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # An environment value is data: keep it out of the step summary and out
          # of any path that a later step interpolates into a shell.
          case "$SCOPE" in
            all|harness|process|product) ;;
            *) if [ ! -e "$SCOPE" ]; then echo "scope is neither a layer nor a path in this repository"; exit 1; fi ;;
          esac
          case "$BUDGET" in
            ''|*[!0-9.]*) echo "budget must be a number"; exit 1 ;;
          esac
          {
            echo "scope=$SCOPE"
            echo "budget=$BUDGET"
            echo "stamp=CCGG-AUDIT-$(date -u +%Y%m%dT%H%M%SZ)"
          } >> "$GITHUB_OUTPUT"
          # The runner has no keychain and no OAuth credential, so this secret is
          # the run's only way to authenticate: no key, no model stage.
          if [ -n "${KEY:-}" ]; then
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "No ANTHROPIC_API_KEY — the deterministic stage runs and the model run is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      # No model, no spend: the facts, the gate's catch rate, and the channel
      # inventory. These artifacts are what the specialists read.
      - name: Deterministic stage
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
          SCOPE: ${{ steps.settings.outputs.scope }}
        run: |
          set -euo pipefail
          python tools/audit_facts.py --out "$STAMP" --scope "$SCOPE"
          python tools/audit_probes.py --out "$STAMP" || true
          case "$SCOPE" in
            all|harness) python tools/audit_redteam.py --out "$STAMP" || true ;;
          esac

      # The verifier is the one agent that executes, and its guard must not come
      # from the tree under audit — a pull request could otherwise ship a guard
      # that permits everything. Take it from the base branch the maintainers own.
      - name: Trusted copy of the verifier guard
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/audit-verifier-guard.sh"
          src=".claude/hooks/audit-verifier-guard.sh"
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA:$src" 2>/dev/null; then
            git show "$BASE_SHA:$src" > "$dest"
            echo "guard taken from the base branch, not from the audited head"
          else
            cp "$src" "$dest"
            echo "no base ref (manual run on a branch the maintainers own); guard taken from the checkout"
          fi
          chmod +x "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      # Nothing to run (no key, or a deliberate dry run): still assemble, so the
      # command, the agents JSON and the orchestrator prompt are on the record.
      - name: Assemble the headless run
        if: steps.settings.outputs.authenticated != 'true' || inputs.dry_run == true
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
          SCOPE: ${{ steps.settings.outputs.scope }}
          GUARD: ${{ steps.guard.outputs.path }}
          BUDGET: ${{ steps.settings.outputs.budget }}
        run: |
          python tools/audit_headless.py \
            --report-dir "$STAMP" --scope "$SCOPE" --guard "$GUARD" \
            --budget-usd "$BUDGET" --dry-run

      # Three authenticated runs died at the first API call, and the log could not
      # say whether the stored secret was mangled or the key itself was rejected.
      # This answers that before a run is spent: the key's SHAPE, never any part of
      # its value, and one minimal live call. A malformed secret fails here; a
      # rejected key fails here with the API's own words.
      - name: Preflight the API key
        if: steps.settings.outputs.authenticated == 'true' && inputs.dry_run != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          key="${ANTHROPIC_API_KEY:-}"
          # Shape only. Length and a known literal prefix are format facts, not key
          # material, and they are what tells a truncated paste from a bad key.
          if [ -z "$key" ]; then
            echo "The secret is empty."
            exit 1
          fi
          # Byte-exact and locale-proof: tr under LC_ALL=C on the raw byte stream.
          # grep is line-based and never sees a trailing newline; a shell character
          # range is collation-dependent. [:graph:] is printable-except-space, so
          # what survives deletion is exactly the junk worth reporting — a space, a
          # newline, a carriage return, a tab, or a UTF-8 byte-order mark.
          stray=$(printf '%s' "$key" | LC_ALL=C tr -d '[:graph:]' | wc -c | tr -d ' ')
          if [ "$stray" -gt 0 ]; then
            echo "The secret carries $stray character(s) that do not belong in an API key."
            # Where and what, never the key itself. The byte names the cause:
            # 0xEF at position 1 is a UTF-8 BOM, 0x0A or 0x0D at the end is a
            # newline from a shell redirect, 0x20 in the middle is a stray space.
            python3 - <<'PYEOF'
          import os
          key = os.environ.get("ANTHROPIC_API_KEY", "")
          bad = [(i + 1, ord(c)) for i, c in enumerate(key) if not (33 <= ord(c) <= 126)]
          where = ", ".join(f"position {p} of {len(key)} (0x{b:02X})" for p, b in bad[:6])
          print(f"stray bytes at: {where}")
          first = bad[0][1] if bad else None
          if first in (0x0A, 0x0D):
              print("That is a newline. A shell redirect appended it — PowerShell needs -NoNewline.")
          elif first in (0xEF, 0xFEFF):
              print("That is a UTF-8 byte-order mark. PowerShell's > and Out-File add one unless told not to.")
          elif first == 0x20:
              print("That is a space. The value was split or padded somewhere.")
          PYEOF
            echo "Set it without a file or a redirect, which avoids every encoding path:"
            echo "  gh secret set ANTHROPIC_API_KEY --repo <owner/name> --app actions --body \"sk-ant-...\""
            exit 1
          fi
          case "$key" in
            sk-ant-*) prefix="sk-ant- (expected)" ;;
            *)        prefix="NOT sk-ant-" ;;
          esac
          echo "key shape: ${#key} characters, prefix ${prefix}"
          if [ "${#key}" -lt 90 ]; then
            echo "That is shorter than an Anthropic API key normally runs (~100+), which is what a truncated paste looks like."
          fi

          # One minimal call. Cheaper than an audit run, and definitive.
          code=$(curl -sS -o "$RUNNER_TEMP/preflight.json" -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: $key" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
            || echo "000")
          echo "api preflight: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "The key authenticates. Anything that fails after this is the run, not the credential." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The API's own error text, which names the problem better than a guess.
          python - "$RUNNER_TEMP/preflight.json" <<'PY' || true
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  body = json.load(fh)
              err = body.get("error") or {}
              print(f"api says: {err.get('type', '?')} — {err.get('message', body)}")
          except Exception:
              print("api returned a body that is not JSON")
          PY
          {
            echo "The stored ANTHROPIC_API_KEY does not authenticate (HTTP $code)."
            echo "The shape above says whether the secret is mangled; anything else means the key itself needs replacing."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install Claude Code
        if: steps.settings.outputs.authenticated == 'true' && inputs.dry_run != true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # A run that spawned no subagent left one question unanswerable from outside:
      # what did the orchestrator actually receive? This asks it, for about a cent,
      # with every flag that shapes the tool set kept identical to the real run.
      - name: Probe the run's tool set
        if: steps.settings.outputs.authenticated == 'true' && inputs.probe_tools == true
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
          SCOPE: ${{ steps.settings.outputs.scope }}
          GUARD: ${{ steps.guard.outputs.path }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          python tools/audit_headless.py \
            --report-dir "$STAMP" --scope "$SCOPE" --guard "$GUARD" --probe-tools \
            2>&1 | tee "$STAMP/probe.log"

      # Two facts a ten-dollar audit run could not establish: whether the verifier's
      # Bash is reachable at all, and whether the guard hook carried inline in its
      # definition fires. Bash is deliberately wide here, so a refusal can only be
      # the guard; the command it must refuse writes a marker nothing reads, and the
      # marker's existence afterwards is the proof that nothing refused it.
      - name: Probe the verifier's guard
        if: steps.settings.outputs.authenticated == 'true' && inputs.probe_verifier == true
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
          SCOPE: ${{ steps.settings.outputs.scope }}
          GUARD: ${{ steps.guard.outputs.path }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          python tools/audit_headless.py \
            --report-dir "$STAMP" --scope "$SCOPE" --guard "$GUARD" --probe-verifier \
            2>&1 | tee "$STAMP/probe.log"

      # The same launcher a maintainer runs locally, with the same assembled command:
      # the tree's settings, hooks, agents, skills and CLAUDE.md excluded, agents
      # inline, the tool set and grants taken from the skill, budget capped.
      # `--agents` takes literal JSON, so it is passed as one argument, never a path.
      - name: Headless audit
        if: steps.settings.outputs.authenticated == 'true' && inputs.dry_run != true && inputs.probe_tools != true && inputs.probe_verifier != true
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
          SCOPE: ${{ steps.settings.outputs.scope }}
          GUARD: ${{ steps.guard.outputs.path }}
          BUDGET: ${{ steps.settings.outputs.budget }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          python tools/audit_headless.py \
            --report-dir "$STAMP" --scope "$SCOPE" --guard "$GUARD" --budget-usd "$BUDGET"

      # The report is rendered from findings.jsonl by a script, not written by the
      # model: a candidate no verifier reached still appears, tagged unverified.
      # The renderer also decides whether this run audited anything at all.
      # always(): a failed or cancelled model step must still leave a report, an
      # artifact and an honest verdict behind. The first authenticated run failed
      # here and skipped all three, so there was nothing to diagnose from.
      - name: Render the report
        id: report
        if: always()
        env:
          STAMP: ${{ steps.settings.outputs.stamp }}
        run: |
          set -euo pipefail
          python tools/audit_report.py --dir "$STAMP" || true
          if [ ! -f "$STAMP/REPORT.md" ] || [ ! -f "$STAMP/status.json" ]; then
            # The renderer itself failed. That is an incomplete run by definition.
            printf '# CCGG audit report\n\n_The renderer failed; this run audited nothing._\n' > "$STAMP/REPORT.md"
            printf '{"complete": false, "blockers": 0, "findings": 0}\n' > "$STAMP/status.json"
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          status = json.load(open(os.path.join(os.environ["STAMP"], "status.json")))
          print(f"blockers={int(status.get('blockers', 0))}")
          print(f"complete={str(bool(status.get('complete', False))).lower()}")
          print(f"findings={int(status.get('findings', 0))}")
          PY

      # The audit never pushes. Its output leaves as an artifact and one comment.
      - name: Upload the report directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccgg-audit-${{ steps.settings.outputs.stamp }}
          path: ${{ steps.settings.outputs.stamp }}/
          retention-days: 14

      - name: Comment the report on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # a failed comment must not bury the findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAMP: ${{ steps.settings.outputs.stamp }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/audit_pr_comment.py \
            --file "$STAMP/REPORT.md" --repo "$REPO" --pr "$PR" --run-url "$RUN_URL"

      # A green check has to mean an audit happened. Zero findings from a run whose
      # model stage never started is not a clean bill, and saying otherwise here
      # would be the exact defect this workflow exists to find.
      - name: Gate
        if: always()
        env:
          BLOCKERS: ${{ steps.report.outputs.blockers }}
          COMPLETE: ${{ steps.report.outputs.complete }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          STAMP: ${{ steps.settings.outputs.stamp }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROBE: ${{ inputs.probe_tools }}
          GUARD_PROBE: ${{ inputs.probe_verifier }}
          AUTHENTICATED: ${{ steps.settings.outputs.authenticated }}
        run: |
          set -euo pipefail
          if [ "$COMPLETE" != "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: assembled the command and rendered the deterministic results. Nothing was audited, as asked."
              echo "Dry run — nothing audited, by request." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$PROBE" = "true" ] || [ "$GUARD_PROBE" = "true" ]; then
              echo "Probe run: asked the run one question and stopped. Nothing was audited, as asked."
              # Repeated here on purpose: the answer is what the run was for, and a
              # reader (or an agent reading the tail of this log) should not have to
              # scroll back past the install step to find it.
              if [ -f "$STAMP/probe.log" ]; then
                grep -E "the tools this run|'Agent' present|the guard|report directory is writable|last words" \
                  "$STAMP/probe.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
              fi
              echo "Probe run — nothing audited, by request; the answer is in the step log." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "This run audited nothing: the model stage left no candidates, no findings and no revision stamp."
            if [ "$AUTHENTICATED" != "true" ]; then
              echo "Cause: no ANTHROPIC_API_KEY secret, so the headless run was skipped."
              echo "Add the secret, or dispatch with dry_run: true when you only want the deterministic half."
            else
              echo "Cause: the headless run started but produced nothing — check the Headless audit step's log."
            fi
            echo "Audited nothing. A green check here would be a false clean bill." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Audit complete: $FINDINGS finding(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "${BLOCKERS:-0}" -gt 0 ]; then
            echo "The audit reported $BLOCKERS blocker(s) — see the report comment or the artifact."
            exit 1
          fi
          echo "No blocker in this run."
